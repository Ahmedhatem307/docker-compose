---
services:
  frontend:
    image: ahmedhatem2k/example-frontend
    ports:
      - "5001:5001"

  backend:
    image: ahmedhatem2k/example-backend
    ports:
      - "8080:8080"
    restart: unless-stopped
    environment:
      - REQUEST_ORIGIN=http://localhost:5001
      - REDIS_HOST=redis
      - POSTGRES_HOST=db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=example
      - POSTGRES_DATABASE=webapp_db

  redis:
    image: redis

  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: example
      POSTGRES_DB: webapp_db
    volumes:
      - ./database:/var/lib/postgresql
