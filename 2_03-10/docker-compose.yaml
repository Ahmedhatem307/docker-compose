---
services:
  frontend:
    image: ahmedhatem2k/example-frontend-proxy

  backend:
    image: ahmedhatem2k/example-backend
    restart: unless-stopped
    environment:
      - REQUEST_ORIGIN=http://localhost
      - REDIS_HOST=redis
      - POSTGRES_HOST=db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=example
      - POSTGRES_DATABASE=webapp_db

  redis:
    image: redis

  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: example
      POSTGRES_DB: webapp_db
    volumes:
      - ./database:/var/lib/postgresql

  nginx:
    image: nginx
    ports:
      - 8000:80
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
